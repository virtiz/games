<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Emberveil: Strategic Relays</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0d0807; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  canvas { position:fixed; left:0; top:0; display:block; }
  #world { z-index:0; }
  #ui { z-index:1; cursor:crosshair; }
  #boot { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#e8d6b0; font-family: Georgia, serif;
    background: radial-gradient(ellipse at 50% 60%, #3a1a10 0%, #140a08 55%, #070404 100%); transition: opacity .6s; }
  #boot h1 { font-size: clamp(34px, 7vw, 76px); letter-spacing: .18em; margin: 0 0 .1em; color:#f3d9a0; text-shadow: 0 0 24px rgba(255,120,40,.55), 0 2px 0 #3a1408; font-weight: 600; }
  #boot h2 { font-size: clamp(12px, 2vw, 16px); letter-spacing: .5em; margin: 0 0 2.2em; color:#b98a5a; font-weight: 400; }
  #bar { width: min(420px, 70vw); height: 6px; border:1px solid #7a5230; background:#1b0e0a; box-shadow: 0 0 18px rgba(255,110,30,.25); }
  #fill { height:100%; width:0%; background: linear-gradient(90deg,#ff7a1a,#ffd27a); box-shadow: 0 0 12px #ff8a30; transition: width .2s; }
  #msg { margin-top: 1em; font-size: 13px; color:#a78a6a; letter-spacing:.08em; min-height: 1.2em; }
</style>
</head>
<body>
<canvas id="world"></canvas>
<canvas id="ui"></canvas>
<div id="boot"><h1>EMBERVEIL</h1><h2>STRATEGIC RELAYS</h2><div id="bar"><div id="fill"></div></div><div id="msg">Kindling the forges...</div></div>
<script>
(function () {
  var PACKS = ["assets/pack-0.js","assets/pack-1.js","assets/pack-2.js","assets/pack-3.js","assets/pack-4.js","assets/pack-5.js"];
  window.__EA = {}; window.__EA_add = function (n, m, b) { window.__EA[n] = { m: m, b: b }; };
  var fill = document.getElementById('fill'), msg = document.getElementById('msg');
  var steps = ['assets/sim.js', 'assets/render.js'].concat(PACKS), total = steps.length + 2, n = 0;
  function prog(t) { fill.style.width = Math.round(100 * Math.min(1, t)) + '%'; }
  function load(src) { return new Promise(function (res, rej) { var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = function () { rej(new Error('missing ' + src)); }; document.head.appendChild(s); }); }
  var chain = Promise.resolve();
  steps.forEach(function (src) { chain = chain.then(function () { return load(src); }).then(function () { prog(++n / total); }); });
  chain.then(function () { msg.textContent = 'Unpacking war machines...'; return window.EmberRender.preload(function (p) { prog((n + p) / total); }); })
    .then(function () { msg.textContent = 'Deploying...'; return load('assets/ui.js'); })
    .then(function () { prog(1); var b = document.getElementById('boot'); b.style.opacity = 0; setTimeout(function () { b.remove(); }, 700); })
    .catch(function (e) { msg.textContent = 'Failed to load: ' + e.message; console.error(e); });
})();
</script>
</body>
</html>
